spring:
    config:
        import: optional:file:.env[.properties]
    datasource:
        url: jdbc:mysql://localhost:3306/dev
        username: root
        password: 1234
        driver-class-name: com.mysql.cj.jdbc.Driver
        
#        hikari:
#            maximum-pool-size: 50     # 동시 처리량에 맞춰 풀 크기 확장
            
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQL8Dialect
    data:
        redis:
            host: localhost
            port: 6379

management:
    endpoints:
        web:
            exposure:
                include: prometheus

jwt:
    secret:
        key: ${JWT_SECRET}